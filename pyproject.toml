[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-to-weight"
version = "0.2.0"
description = "Write a document into a low-rank weight on a frozen LLM, then answer questions about it with the document removed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.56",
  "accelerate",
  "safetensors",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ctw = "ctw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
