# CCD on the six-fact memorandum: names, codes, quantities, and days with multi-token answers,
# swept over ΔW scale. Untuned.
name: qwen3-4b-ccd-memo
model:
  id: Qwen/Qwen3-4B
  dtype: bfloat16
prompt:
  system: Answer with only the exact requested value. If the information is unavailable, answer UNKNOWN.
  context_label: "Reference memorandum:"
memory:
  layers: [0.56, 0.67, 0.78, 0.89]
writer:
  name: ccd
task:
  name: memo
eval:
  scales: [0.5, 1.0, 1.5]
  max_new_tokens: 12
  selectivity: true
