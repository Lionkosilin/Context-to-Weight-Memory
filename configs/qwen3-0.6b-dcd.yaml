# Deep context distillation on your own documents. Replace task.params.path with your bank.
name: qwen3-0.6b-dcd
model:
  id: Qwen/Qwen3-0.6B
memory:
  layers: last:4
writer:
  name: dcd
  params: {kind: lowrank, rank: 16, lr: 1.0e-3, passes: 8, chunk: 256, recent: 1024}
task:
  name: qa_json
  params: {path: examples/lighthouse.json}
eval:
  arms: [off, context, write, random]
  max_new_tokens: 16
  export_txt: true
